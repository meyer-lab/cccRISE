# The IBD tables behind Figure 5's program panels, from the finalized factor
# fit and the cohort's cells. Generated by cccrise.runners.run_ibd_programs --
# do not hand-edit.
#
# One record per data file in this folder: `shared` holds what every file's
# record has in common, `files` the rest of each, with the file's sha256 and
# the command that writes it with this repository's code.

shared:
  command: uv run cccrise-ibd-programs --dataset ibd
  dataset: ibd
  dataset_label: IBDverse Crohn's Disease Terminal Ileum (<= 2000 cells per condition, seed
    0)
  source_file: /opt/IVCSC/full_IBD_cohort.ivcsc.h5ad
  source_sha256: 5ceb34f29472ea55d547356fdc5ae923c34dd1537030b1f1a1d2595c98555fc0
  loader_args:
    filename: /opt/IVCSC/full_IBD_cohort.ivcsc.h5ad
    gene_threshold: 0.001
    normalize: true
    max_cells_per_condition: 2000
    cell_cap_seed: 0
    excluded_broad_cell_types:
    - Mesenchymal
  condition_key: sanger_sample_id
  celltype_key: broad_cell_type
  group_key: inflammation_status
  dataset_notes: 'Krzak et al. Nat Genet 2026 terminal-ileum cohort: 343 samples, 232 healthy
    and 111 Crohn''s (64 inflamed / 47 uninflamed). `celltype` holds 57 annotated types matching
    the published DGE tables; `broad_cell_type` holds 8 lineages, of which the mesenchymal
    one (fibroblasts, endothelial cells, pericytes) is excluded as a biopsy-sampling artifact
    (`import_data.IBD_EXCLUDED_BROAD_CELL_TYPES`).'
  factors_path: cccrise/data/factors/ibd_ti_factors.nc
  factors_sha256: 27180af4a6fbceaacdce5ff6fc172280484e00ff3cc3abfe084c518e065aef71
  random_state: 0
  pacmap_random_state: 42
  n_perms: 10000
  n_top: 10
  programs: [1, 5]
  resulting_dims:
    conditions: 343
    genes: 23355
    cells: 634534
    lr_pairs: 1255
