StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = write-good

Vocab = CCCRISE

[*.qmd]
# Quarto shortcodes ({{< fig ... >}}) and citation keys (@ibdverse-...) are
# labels, not prose: unignored, Vale reads "in {{< fig >}} and {{< fig >}} and"
# as a repeated "and" and lowercase keys as misspelled terms
TokenIgnores = (\{\{<[^>]*>\}\}), (@[A-Za-z0-9_:./-]+)
BasedOnStyles = Vale, write-good
write-good.E-Prime = NO
write-good.Passive = NO
write-good.TooWordy = NO
write-good.ThereIs = NO
write-good.So = NO

[MSB-review.md]
BasedOnStyles =

# TODO: remove once the Lorem-ipsum placeholder responses are replaced
[review-response.qmd]
Vale.Spelling = NO
Vale.Terms = NO
