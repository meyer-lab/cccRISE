# Google Docs export profile: numbered superscript citations whose links open
# the cited work (DOI/PubMed/arXiv) instead of the local reference list.
# Render with `quarto render manuscript.qmd --profile gdoc --to html`, then
# copy/paste from the HTML.
csl: nature.csl
citeproc: false
filters:
    - pandoc-cite
    - path: _cite_links.lua
      at: post-render
