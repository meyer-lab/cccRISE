<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="diag" width="20" height="20" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#f2f2f2"/>
      <line x1="0" y1="0" x2="0" y2="20" stroke="#d0d0d0" stroke-width="10"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="600" fill="url(#diag)" stroke="#999999" stroke-width="2"/>
  <text x="400" y="300" font-family="Helvetica, Arial, sans-serif" font-size="36" fill="#666666" text-anchor="middle" dominant-baseline="middle">FIGURE PLACEHOLDER</text>
</svg>
