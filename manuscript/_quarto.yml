project:
    type: default
    render:
        - manuscript.qmd
        - supplemental.qmd
        - review-response.qmd
    output-dir: _output

citeproc: true
# Molecular Systems Biology (EMBO Press) author-date style.
csl: embo-press.csl

# Panel letters per figure, written by `cccrise-fbuild`, and supplement numbers
# (by order of first mention), referenced via the `fig`/`panel` shortcodes.
metadata-files:
    - _panels.yml
shortcodes:
    - _panels.lua
supplements: [alad_cohort, rise_factor_matrices, cmp_stability, nichenet, cmp5_identity, alad_associations, anova_stability, ccc_scoring, imputation_ridge]

crossref:
    fig-prefix: Fig.
    title-delim: "."
filters:
    - pandoc-cite
    - path: _bold_fig_prefix.lua
      at: post-render

format:
    html:
        toc: true
        number-sections: false
        embed-resources: true
        theme: cosmo
    typst:
        papersize: us-letter
        margin:
            x: 1in
            y: 1in
        number-sections: false
