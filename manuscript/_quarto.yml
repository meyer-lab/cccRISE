project:
    type: default
    render:
        - manuscript.qmd
        - appendix.qmd
        - review-response.qmd
    output-dir: _output

citeproc: true
# Molecular Systems Biology (EMBO Press) author-date style.
csl: embo-press.csl
# Hand-written entries (references without usable DOI metadata: datasets,
# consortium-authored papers); kept out of the
# `references` metadata, which pandoc-cite overwrites.
bibliography: datasets.json

# Panel letters per figure, written by `cccrise-fbuild`, and supplementary
# figure numbers, referenced via the `fig`/`panel`/`label` shortcodes. MSB has
# two classes of supplementary figure, each numbered in its list's order:
# Expanded View figures (at most five; legends in the main text) and Appendix
# figures (a separate PDF). `cccrise-sourcedata` labels source data the same.
metadata-files:
    - _panels.yml
shortcodes:
    - _panels.lua
    - _xlsx.lua
ev_figures: [cmp5_identity, alad_associations, ccc_scoring, ibd_hormone_axes, comparator_split]
appendix_figures: [alad_cohort, ibd_rank_selection, ibd_associations, comparator_rank_selection, comparator_missed, comparator_single_cell]
# Appendix tables (Appendix Table S1, ...), written by `python -m cccrise.figures.tables`
appendix_tables: [alad_outcome_groups, cohort_cell_types]
# Reviewer figures (Reviewer Figure R1, ...), in the response to reviewers only
reviewer_figures: [scriabin]

crossref:
    fig-prefix: Fig.
    title-delim: "."
filters:
    - pandoc-cite
    - path: _bold_fig_prefix.lua
      at: post-render

format:
    html:
        toc: true
        number-sections: false
        embed-resources: true
        theme: cosmo
    typst:
        papersize: us-letter
        margin:
            x: 1in
            y: 1in
        number-sections: false
