project:
    type: default
    render:
        - manuscript.qmd
        - appendix.qmd
        - review-response.qmd
    output-dir: _output

citeproc: true
# Molecular Systems Biology (EMBO Press) author-date style.
csl: embo-press.csl

# Panel letters per figure, written by `cccrise-fbuild`, and supplementary
# figure numbers, referenced via the `fig`/`panel`/`label` shortcodes. MSB has
# two classes of supplementary figure, each numbered in its list's order:
# Expanded View figures (at most five; legends in the main text) and Appendix
# figures (a separate PDF). `cccrise-sourcedata` labels source data the same.
metadata-files:
    - _panels.yml
shortcodes:
    - _panels.lua
ev_figures: [alad_cohort, cmp5_identity, ccc_scoring, ibd_hormone_axes, comparator_split]
appendix_figures: [rise_factor_matrices, cmp_stability, alad_associations, anova_stability, ibd_rank_selection, ibd_associations, scriabin, comparator_rank_selection, comparator_map, comparator_missed_alad, comparator_missed_ibd, comparator_niches]
# Appendix tables (Appendix Table S1, ...), written by `python -m cccrise.figures.tables`
appendix_tables: [alad_outcome_groups]

crossref:
    fig-prefix: Fig.
    title-delim: "."
filters:
    - pandoc-cite
    - path: _bold_fig_prefix.lua
      at: post-render

format:
    html:
        toc: true
        number-sections: false
        embed-resources: true
        theme: cosmo
    typst:
        papersize: us-letter
        margin:
            x: 1in
            y: 1in
        number-sections: false
