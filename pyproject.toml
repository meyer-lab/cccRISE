[project]
name = "cellcommunicationpf2"
version = "0.1.0"
description = "Cell cell communication implementation of PARAFAC2"
authors = [{name = "Andrew Ramirez", email = "andramirez@ucla.edu" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.2",
    "scipy>=1.16.0",
    "scikit-learn>=1.4.2",
    "anndata>=0.11.3",
    "tensorly>=0.9.0",
    "matplotlib~=3.10.1",
    "seaborn~=0.13.2",
    "datashader>=0.17.0",
    "pacmap>=0.8.0",
    "tensorly-viz>=0.1.7",
    "parafac2[gpu] @ git+https://github.com/meyer-lab/parafac2.git@v1.4.0",
    "pyarrow>=15.0.0",
    "xarray>=2024.1.0",
    "netcdf4>=1.6.5",
    "scanpy>=1.12.3",
    "cupy-cuda12x>=14.1.1; sys_platform != 'darwin'",
]

readme = "README.md"

[project.urls]
Homepage = "https://github.com/meyer-lab/cellcommunication-Pf2"
Repository = "https://github.com/meyer-lab/cellcommunication-Pf2"
Documentation = "https://meyer-lab.github.io/cellcommunication-Pf2/"

[project.scripts]
fbuild = "cellcommunicationpf2.figures.common:genFigure"
factor = "cellcommunicationpf2.imports:factorSave"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.1",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "nbsphinx>=0.9",
]

[tool.ruff.lint]
ignore = [
    "N999",   # figure modules are intentionally named figureXX.py
    "BLE001", # figure scripts deliberately catch broad exceptions to keep batch analyses running
]

[tool.pytest.ini_options]
addopts = "-n auto"

