[project]
name = "cccrise"
version = "0.1.0"
description = "Cell cell communication implementation of PARAFAC2"
authors = [{name = "Andrew Ramirez", email = "andramirez@ucla.edu" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.2",
    "scipy>=1.16.0",
    "scikit-learn>=1.4.2",
    "anndata>=0.11.3",
    "tensorly>=0.10.0",
    "matplotlib>=3.11",
    "seaborn~=0.13.2",
    "datashader>=0.17.0",
    "pacmap>=0.8.0",
    "tensorly-viz>=0.1.7",
    "parafac2>=1.10.0",
    "scrise>=1.7.0",
    "pyarrow>=15.0.0",
    "xarray>=2024.1.0",
    "netcdf4>=1.6.5",
    "h5netcdf>=1.3.0",
    "scanpy>=1.12.3",
    "shiny>=1.7.0",
    "vsparse>=0.2.0",
    "pyreadr>=0.5.6",
    "pyyaml>=6.0",
    "adjusttext>=1.4.0",
    "kneed>=0.8.5",
    "threadpoolctl>=3.5",
]

readme = "README.md"

[project.optional-dependencies]
# GPU support is optional. Propagate parafac2's own `gpu` extra rather than
# re-declaring its pieces here: `_matmul_cupy`'s sparse path needs
# nvmath-python alongside CuPy, and hand-picking only cupy-cuda12x left that
# missing, so backend="cupy" crashed with ModuleNotFoundError on any sparse
# (i.e. every real ALAD/IBD) fit before touching the GPU at all.
gpu = [
    "parafac2[gpu]>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/meyer-lab/cellcommunication-Pf2"
Repository = "https://github.com/meyer-lab/cellcommunication-Pf2"
Documentation = "https://meyer-lab.github.io/cellcommunication-Pf2/"

[project.scripts]
cccrise-fbuild = "cccrise.figures.common:genFigure"
cccrise-sourcedata = "cccrise.figures.source_data:main"
cccrise-run = "cccrise.runners.run_ccc_rise:main"
cccrise-riserank = "cccrise.runners.run_rise_rank:main"
cccrise-cpdrank = "cccrise.runners.run_cpd_rank:main"
cccrise-comparators = "cccrise.runners.run_comparators:main"
cccrise-comparator-scores = "cccrise.runners.run_comparator_scores:main"
cccrise-comparator-nichenet = "cccrise.runners.run_comparator_nichenet:main"
cccrise-reduced-rise = "cccrise.runners.run_reduced_rise:main"
cccrise-stability = "cccrise.runners.run_stability:main"
cccrise-significance = "cccrise.runners.run_significance:main"
cccrise-nichenet = "cccrise.runners.run_nichenet:main"
cccrise-altcommscore = "cccrise.runners.run_alt_comm_score:main"
cccrise-cohort = "cccrise.runners.run_cohort:main"
cccrise-ibd-programs = "cccrise.runners.run_ibd_programs:main"
cccrise-alad-programs = "cccrise.runners.run_alad_programs:main"
cccrise-niches = "cccrise.runners.run_niches:main"
cccrise-scriabin-seeds = "cccrise.runners.run_scriabin_seeds:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
analysis = [
    "vsparse>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.1",
    "pre-commit>=4.0",
    "panache-cli>=3.10.0",
    "vale>=3.21.0",
    "vulture>=2.16",
    "radon>=6.0.1",
    "xenon>=0.9.3",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "nbsphinx>=0.9",
]

[tool.ruff.lint]
ignore = [
    "N999",   # figure modules are intentionally named figureXX.py
    "BLE001", # figure scripts deliberately catch broad exceptions to keep batch analyses running
]

[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
addopts = "-n auto"
