[project]
name = "cccrise"
version = "0.1.0"
description = "Cell cell communication implementation of PARAFAC2"
authors = [{name = "Andrew Ramirez", email = "andramirez@ucla.edu" }]
license = "MIT"
requires-python = ">= 3.13"

dependencies = [
    "numpy>=2.2",
    "scipy>=1.16.0",
    "scikit-learn>=1.4.2",
    "anndata>=0.11.3",
    "tensorly>=0.9.0",
    "matplotlib~=3.10.1",
    "seaborn~=0.13.2",
    "datashader>=0.17.0",
    "pacmap>=0.8.0",
    "tensorly-viz>=0.1.7",
    "parafac2>=1.7.0",
    "scrise>=1.4.0",
    "pyarrow>=15.0.0",
    "xarray>=2024.1.0",
    "netcdf4>=1.6.5",
    "scanpy>=1.12.3",
    "vsparse>=0.2.0",
    "pyreadr>=0.5.6",
    "pyyaml>=6.0",
]

readme = "README.md"

[project.optional-dependencies]
# CuPy is optional. The `[ctk]` extra ships the CUDA toolkit headers CuPy JIT-compiles against.
gpu = [
    "cupy-cuda12x[ctk]>=13.0; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://github.com/meyer-lab/cellcommunication-Pf2"
Repository = "https://github.com/meyer-lab/cellcommunication-Pf2"
Documentation = "https://meyer-lab.github.io/cellcommunication-Pf2/"

[project.scripts]
fbuild = "cccrise.figures.common:genFigure"
factor = "cccrise.imports:factorSave"
cccrise-run = "cccrise.runners.run_ccc_rise:main"
cccrise-riserank = "cccrise.runners.run_rise_rank:main"
cccrise-cpdrank = "cccrise.runners.run_cpd_rank:main"
cccrise-anovaboot = "cccrise.runners.run_anova_bootstrap:main"
cccrise-stability = "cccrise.runners.run_component_stability:main"
cccrise-significance = "cccrise.runners.run_significance:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
analysis = [
    "vsparse>=0.2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.1",
    "pre-commit>=4.0",
    "panache-cli>=3.10.0",
    "vale>=3.21.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "nbsphinx>=0.9",
]

[tool.ruff.lint]
ignore = [
    "N999",   # figure modules are intentionally named figureXX.py
    "BLE001", # figure scripts deliberately catch broad exceptions to keep batch analyses running
]

[tool.ty.src]
# Legacy figures still reference the pre-ANOVA logreg API and will be
# removed along with the rest of the outdated figure/manuscript files.
exclude = [
    "cccrise/figures/figure4.py",
    "cccrise/figures/figureA6d.py",
]

[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.pytest.ini_options]
addopts = "-n auto"
